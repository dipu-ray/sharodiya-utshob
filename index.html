<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharodiya Utshob - Durga Puja Web Hub</title>

    <!-- To link external CSS file -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Glowing Orb's -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- Header or Navbar -->
    <header class="navbar">
        <div class="logo">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" stroke="#e9c46a" stroke-width="2" fill="rgba(255,255,255,0.08)" />
                <path d="M32 14 L38 30 L54 32 L38 34 L32 50 L26 34 L10 32 L26 30 Z" fill="#e9c46a" />
            </svg>
            <div class="logo-text">
                <strong>Durga Puja</strong>
                <span>Sharodiya Utshob</span>
            </div>
        </div>
        <button class="glass-btn" id="subs-btn">সাবস্ক্রাইব করুন</button>
    </header>

    <!-- Countdown -->
    <div class="countdown-wrap">
        <div class="countdown">
            <span class="countdown-label">মহাষষ্ঠী শুরু হতে বাকি</span>
            <div class="countdown-units">
                <div class="countdown-unit"><span class="num" id="cd-days">00</span><span class="unit">দিন</span></div>
                <div class="countdown-unit"><span class="num" id="cd-hours">00</span><span class="unit">ঘণ্টা</span>
                </div>
                <div class="countdown-unit"><span class="num" id="cd-mins">00</span><span class="unit">মিনিট</span>
                </div>
                <div class="countdown-unit"><span class="num" id="cd-secs">00</span><span class="unit">সেকেন্ড</span>
                </div>
            </div>
        </div>
    </div>

    <!-- To link external JS file -->
    <script type="module" src="./js/main.js"></script>
</body>

</html>
